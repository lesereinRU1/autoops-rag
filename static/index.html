<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoOps RAG</title>
  <style>
    :root { color-scheme: light; --ink:#132238; --blue:#155eef; --line:#dce3ed; --soft:#f4f7fb; }
    * { box-sizing:border-box; } body { margin:0; font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif; color:var(--ink); background:#eef2f7; }
    main { max-width:1100px; margin:38px auto; padding:0 20px; }
    header,section { background:white; border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:18px; box-shadow:0 10px 30px #243b5a0b; }
    h1 { margin:0 0 4px; font-size:28px; } .sub { color:#5e6d80; margin:0; }
    .status { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; } .pill { background:var(--soft); border-radius:999px; padding:5px 11px; }
    textarea,input,select { width:100%; border:1px solid #bbc6d5; border-radius:10px; padding:11px; font:inherit; background:white; }
    textarea { min-height:90px; resize:vertical; } .grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin:12px 0; }
    button { border:0; border-radius:10px; padding:10px 18px; color:white; background:var(--blue); font-weight:650; cursor:pointer; }
    button.secondary { background:#43536a; }
    button:disabled { opacity:.55; } #answer { white-space:pre-wrap; background:var(--soft); border-radius:12px; padding:16px; min-height:72px; }
    .hit { border-top:1px solid var(--line); padding:14px 0; } .meta { font-size:13px; color:#607086; } .score { color:var(--blue); font-weight:700; }
    .tag { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; background:#e7f6ed; color:#087443; font-size:12px; }
    details { margin-top:8px; } summary { cursor:pointer; color:#42546b; font-weight:650; }
    .tech-panel { border-top:1px solid var(--line); margin-top:18px; padding-top:14px; }
    .evidence-text { margin-top:8px; padding:12px; border-radius:8px; background:var(--soft); white-space:pre-wrap; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; } .actions button { background:#34445b; }
    .actions[hidden] { display:none !important; }
    .actions button.verify { background:#087443; } .trace { display:grid; gap:8px; }
    .trace-item { background:var(--soft); border-left:4px solid var(--blue); border-radius:8px; padding:9px 12px; }
    .relation { display:inline-block; margin:3px; padding:4px 8px; border-radius:8px; background:#edf3ff; font-size:13px; }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body><main>
  <header>
    <h1>AutoOps RAG</h1>
    <p class="sub">S7-1200 / Modbus 本地手册检索和引用</p>
    <div class="status" id="status"><span class="pill">正在读取索引状态…</span></div>
  </header>
  <section>
    <label for="question"><strong>问题</strong></label>
    <textarea id="question">为什么设备手册写 40001，而 Modbus TCP 报文地址常从 0 开始？</textarea>
    <div class="grid">
      <select id="model" aria-label="设备型号"><option value="S7-1200">S7-1200 经典系列（V4.6英文手册）</option><option value="S7-1200 G2">S7-1200 G2（2025中文手册）</option><option value="">不限定型号</option></select>
      <input id="version" placeholder="固件版本（可空）" aria-label="版本">
      <select id="mode" aria-label="调用方式"><option value="chat">手册问答</option><option value="search">只检索</option></select>
    </div>
    <button id="ask">开始查询</button> <button id="clearSession" class="secondary" type="button">清空本页会话</button> <span id="sessionStatus" class="meta"></span>
  </section>
  <section>
    <h2>回答</h2><div id="answer">等待查询。</div><div id="runtime" class="meta"></div>
    <div class="actions" id="actions" hidden>
      <button id="helpful">👍 有帮助</button><button id="unhelpful">👎 无帮助</button>
      <button class="verify" id="verify">保存为已确认方案</button>
      <span id="actionStatus" class="meta"></span>
    </div>
    <details class="tech-panel"><summary>查看处理过程和知识关系</summary>
      <h3>处理过程</h3><div id="trace" class="trace">等待查询。</div>
      <h3>知识关系</h3><div id="graphContext">等待查询。</div>
    </details>
    <details class="tech-panel"><summary>查看 RAG Trace</summary>
      <div id="ragTrace" class="trace">等待查询。</div>
    </details>
    <h2>参考依据</h2><p class="meta">点击来源可查看原文、表格内容和技术标识。</p><div id="evidence"></div>
  </section>
</main>
<script>
const statusBox=document.querySelector('#status'), answer=document.querySelector('#answer'), runtimeBox=document.querySelector('#runtime'), evidence=document.querySelector('#evidence'), button=document.querySelector('#ask'), clearSessionButton=document.querySelector('#clearSession'), sessionStatus=document.querySelector('#sessionStatus'), actions=document.querySelector('#actions'), traceBox=document.querySelector('#trace'), graphBox=document.querySelector('#graphContext'), ragTraceBox=document.querySelector('#ragTrace'), actionStatus=document.querySelector('#actionStatus');
const sessionId=localStorage.getItem('autoopsSessionId')||(`web-${Date.now()}-${Math.random().toString(16).slice(2)}`);localStorage.setItem('autoopsSessionId',sessionId);
let lastRequest=null,lastResponse=null;
async function loadStatus(){const [hr,mr]=await Promise.all([fetch('/health'),fetch('/api/metrics/business')]);const s=await hr.json(),m=await mr.json();statusBox.innerHTML=`<span class="pill">索引 ${s.indexed_chunks} 块</span><span class="pill">表格行 ${s.table_row_chunks}</span><span class="pill">结构化表 ${s.structured_tables}</span><span class="pill">向量 ${s.embedding_backend}</span><span class="pill">模型 ${s.llm_enabled?escapeHtml(s.llm_model):'未启用'}</span><span class="pill">活跃资料 ${s.active_sources}</span><span class="pill">资料核验 ${s.latest_checked_at}</span><span class="pill">反馈 ${m.feedback_total}</span><span class="pill">已验证方案 ${m.verified_solutions}</span>`;}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
function displayDocName(name){const names={'S7-1200 Programmable Controller System Manual V4.6':'S7-1200 可编程控制器系统手册 V4.6（英文原文）','Modbus/TCP with MB_CLIENT and MB_SERVER':'S7-1200/1500 Modbus TCP 通信专题（英文原文）'};return names[name]||name;}
function showHits(hits){evidence.innerHTML=(hits||[]).map((h,i)=>{const m=h.chunk.metadata||{},isTable=m.representation==='table_row',tag=isTable?`<span class="tag">结构化表格，第 ${escapeHtml(m.row_index)} 行</span>`:'',name=displayDocName(h.chunk.doc_name);return `<div class="hit"><div><strong>来源 ${i+1}</strong>，${escapeHtml(name)}，第 ${h.chunk.page} 页 ${tag}</div><details><summary>查看原文和技术标识</summary><div class="meta">相关度 ${(h.rerank_score??h.score).toFixed(4)}，切片标识 ${escapeHtml(h.chunk.chunk_id)}${isTable?`，表格标识 ${escapeHtml(m.table_id)}`:''}</div><div class="evidence-text">${escapeHtml(h.chunk.text.slice(0,700))}</div></details></div>`;}).join('')||'没有检索结果。';}
const nodeLabels={conversation_context:'最近问题补充',route:'问题识别与工具选择',knowledge_graph:'知识关系匹配',scope_and_safety_gate:'范围与安全检查',safe_refusal:'安全拒答',verified_memory:'历史验证方案检查',hybrid_retrieval:'混合检索',evidence_gate:'证据充分性检查',query_rewrite:'问题改写',answer_with_citations:'生成带来源回答'};
const keyLabels={turns_used:'使用历史轮数',history_chars:'历史字符数',tool:'所选工具',reason:'判断原因',matched_entities:'命中实体',expanded_terms:'扩展词',relations:'关系数',solution_id:'方案编号',similarity:'相似度',decision:'处理结果',strategy:'检索策略',query_expanded:'是否使用查询扩展',query_expansion_terms:'查询扩展词',hits:'结果数',distinct_documents:'文档数',top_score:'最高相关度',sufficient:'证据是否充分',identifiers_supported:'技术标识是否被证据覆盖',retry_count:'已重试次数',attempt:'改写次数',evidence_count:'证据数',mode:'回答方式',accepted:'是否通过',category:'拒答类型',attempted_models:'尝试模型',final_model:'实际模型',fallback_reason:'降级原因'};
const valueLabels={search_manual:'手册检索',lookup_alarm_code:'故障码查询',check_parameter_range:'参数范围查询',no_verified_match:'没有匹配的已验证方案',reuse_with_manual_verification:'复用并重新核对手册',local_extractive:'本地证据摘录',llm_grounded:'外部模型基于证据生成'};
function displayValue(v){if(v===undefined||v===null||v==='')return '未返回';if(typeof v==='boolean')return v?'是':'否';if(Array.isArray(v))return v.map(displayValue).join('、')||'无';if(typeof v==='object')return JSON.stringify(v);return valueLabels[v]||v;}
function valueOrMissing(v){return v===undefined||v===null||v===''?'未返回':v;}
function renderAgentTraceItems(items){if(!Array.isArray(items))return '<div class="meta">未返回 Agent Trace。</div>';return items.map((x,i)=>`<div class="trace-item"><strong>${i+1}. ${escapeHtml(nodeLabels[x?.node]||x?.node||'未命名节点')}</strong><div class="meta">${Object.entries(x||{}).filter(([k])=>k!=='node').map(([k,v])=>`${escapeHtml(keyLabels[k]||k)}：${escapeHtml(displayValue(v))}`).join('；')||'无附加字段'}</div></div>`).join('')||'<div class="meta">Agent Trace 为空。</div>';}
function showTrace(items){traceBox.innerHTML=renderAgentTraceItems(items);}
function showGraph(kg){const types={instruction:'指令',alarm:'故障码',parameter:'参数',protocol:'协议',device:'设备'};const entities=(kg?.matched_entities||[]).map(x=>`<span class="relation">${types[x.type]||x.type}：${escapeHtml(x.label)}</span>`).join('');const relations=(kg?.relations||[]).map(x=>`<span class="relation">${escapeHtml(x.source)}，${escapeHtml(x.relation)}，${escapeHtml(x.target)}</span>`).join('');graphBox.innerHTML=entities||relations?`<div>${entities}</div><div>${relations}</div>`:'本次问题没有命中预设的知识关系。';}
function renderCandidateStage(title,items){if(!Array.isArray(items))return `<div class="trace-item"><strong>${escapeHtml(title)}</strong><div class="meta">未返回</div></div>`;if(!items.length)return `<div class="trace-item"><strong>${escapeHtml(title)}</strong><div class="meta">无结果</div></div>`;return `<details><summary>${escapeHtml(title)}（${items.length} 条）</summary>${items.map((x,i)=>`<div class="trace-item"><strong>#${escapeHtml(valueOrMissing(x?.rank??i+1))} ${escapeHtml(valueOrMissing(x?.chunk_id))}</strong><div class="meta">资料：${escapeHtml(displayDocName(valueOrMissing(x?.doc_name)))}；页码：${escapeHtml(valueOrMissing(x?.page))}；综合分数：${escapeHtml(valueOrMissing(x?.score))}；向量排名：${escapeHtml(valueOrMissing(x?.dense_rank))}；关键词排名：${escapeHtml(valueOrMissing(x?.bm25_rank))}；重排分数：${escapeHtml(valueOrMissing(x?.rerank_score))}</div></div>`).join('')}</details>`;}
function showRagTrace(t,runtime,agentItems){if(!t){ragTraceBox.textContent='只检索模式不生成 RAG Trace。';return;}runtime=runtime||{};const dense=Array.isArray(t.dense_topk)?t.dense_topk:null,bm25=Array.isArray(t.bm25_topk)?t.bm25_topk:null,rrf=Array.isArray(t.rrf_topk)?t.rrf_topk:(Array.isArray(t.fused_results)?t.fused_results:null),finalEvidence=Array.isArray(t.final_evidence)?t.final_evidence:null;const tokenAvailable=t.token_usage_available??runtime.token_usage_available;const totalTokens=t.total_tokens??runtime.external_token_usage,inputTokens=t.input_tokens??runtime.external_input_tokens,outputTokens=t.output_tokens??runtime.external_output_tokens;const tokens=tokenAvailable?`${valueOrMissing(totalTokens)}（输入 ${valueOrMissing(inputTokens)}，输出 ${valueOrMissing(outputTokens)}）`:`未返回（${t.token_usage_missing_reason||runtime.token_usage_missing_reason||'原因未知'}）`;const retrievedIds=Array.isArray(finalEvidence)?finalEvidence.map(x=>x?.chunk_id).filter(Boolean):(Array.isArray(t.retrieved_chunk_ids)?t.retrieved_chunk_ids:null);const usedIds=Array.isArray(t.used_chunk_ids)?t.used_chunk_ids:null;const citedIds=Array.isArray(t.actual_cited_chunk_ids)?t.actual_cited_chunk_ids:(Array.isArray(t.cited_chunk_ids)?t.cited_chunk_ids:null);const contexts=Array.isArray(t.injected_context)?(t.injected_context.map(x=>`<details><summary>${escapeHtml(valueOrMissing(x?.chunk_id))}，${escapeHtml(displayDocName(valueOrMissing(x?.doc_name)))}，第 ${escapeHtml(valueOrMissing(x?.page))} 页</summary><div class="meta">章节：${escapeHtml(Array.isArray(x?.section_path)?x.section_path.join(' › '):valueOrMissing(x?.section_path))}</div><div class="evidence-text">${escapeHtml(valueOrMissing(x?.text))}</div></details>`).join('')||'<div class="meta">无注入证据。</div>'):'<div class="meta">未返回注入上下文。</div>';const externalCalls=t.external_calls??runtime.external_llm_calls;const attempted=Array.isArray(t.attempted_models)?t.attempted_models:(Array.isArray(runtime.attempted_models)?runtime.attempted_models:null);ragTraceBox.innerHTML=`<div class="trace-item"><strong>请求概览</strong><div class="meta">请求编号：${escapeHtml(valueOrMissing(t.request_id))}；原始问题：${escapeHtml(valueOrMissing(t.original_question))}；处理问题：${escapeHtml(valueOrMissing(t.question))}；问题类型：${escapeHtml(displayValue(t.question_type))}；所选工具：${escapeHtml(displayValue(t.selected_tool))}；设备型号：${escapeHtml(valueOrMissing(t.device_model))}；是否拒答：${escapeHtml(displayValue(t.refused))}</div></div><div class="trace-item"><strong>检索链路</strong><div class="meta">检索方式：${escapeHtml(valueOrMissing(t.retrieval_strategy))}；问题改写：${escapeHtml(valueOrMissing(t.query_rewrite_attempts))} 次；检索耗时：${escapeHtml(valueOrMissing(t.retrieval_latency_ms??runtime.retrieval_latency_ms))} 毫秒；证据是否充分：${escapeHtml(displayValue(t.evidence_sufficient))}</div></div>${renderCandidateStage('向量检索候选',dense)}${renderCandidateStage('关键词检索候选',bm25)}${renderCandidateStage('融合排序结果',rrf)}${renderCandidateStage('最终证据',finalEvidence)}<div class="trace-item"><strong>证据与引用</strong><div class="meta">检索得到的证据切片：${escapeHtml(Array.isArray(retrievedIds)?retrievedIds.join('、')||'无':'未返回')}<br>注入/使用候选切片：${escapeHtml(Array.isArray(usedIds)?usedIds.join('、')||'无':'未返回')}<br><strong>说明：</strong>注入/使用候选不等同于答案真实逐句引用。<br>真实逐句引用切片：${escapeHtml(Array.isArray(citedIds)?citedIds.join('、')||'无':'未返回（当前接口未单独提供）')}</div>${contexts}</div><div class="trace-item"><strong>生成链路</strong><div class="meta">生成方式：${escapeHtml(displayValue(t.generation_mode??runtime.generation_mode))}；实际模型：${escapeHtml(t.final_model||runtime.final_model||'未使用（本地回答）')}；尝试模型：${escapeHtml(Array.isArray(attempted)?attempted.join(' → ')||'无':'未返回')}；外部调用：${escapeHtml(valueOrMissing(externalCalls))} 次；降级原因：${escapeHtml(t.fallback_reason||runtime.generation_fallback_reason||'无')}；token：${escapeHtml(tokens)}；检索耗时：${escapeHtml(valueOrMissing(t.retrieval_latency_ms??runtime.retrieval_latency_ms))} 毫秒；模型耗时：${escapeHtml(valueOrMissing(t.llm_latency_ms??runtime.llm_latency_ms))} 毫秒；首个输出可用耗时：${escapeHtml(valueOrMissing(t.first_token_latency_ms??runtime.first_token_latency_ms))} 毫秒；总耗时：${escapeHtml(valueOrMissing(t.total_latency_ms??runtime.total_ms))} 毫秒</div></div><div class="trace-item"><strong>Agent Trace</strong><div class="meta">按执行顺序展示路由、检索、证据判断、问题改写和生成节点。</div></div>${renderAgentTraceItems(agentItems)}${Array.isArray(t.warnings)&&t.warnings.length?`<div class="trace-item"><strong>校验提醒</strong><div class="meta">${escapeHtml(t.warnings.join('；'))}</div></div>`:''}`;}
button.onclick=async()=>{button.disabled=true;actions.hidden=true;actionStatus.textContent='';answer.textContent='正在检索…';runtimeBox.textContent='';evidence.innerHTML='';traceBox.textContent='正在执行…';graphBox.textContent='正在扩展实体…';ragTraceBox.textContent='正在记录…';const body={query:question.value,model:model.value,version:version.value,top_k:5,session_id:sessionId};lastRequest=body;try{const endpoint=mode.value==='chat'?'/api/chat':'/api/search';const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);lastResponse=data;answer.textContent=data.answer||`找到 ${(data.hits||[]).length} 条结果`;if(data.runtime){const tokenText=data.runtime.token_usage_available?`${data.runtime.external_token_usage}（输入 ${data.runtime.external_input_tokens}，输出 ${data.runtime.external_output_tokens}）`:`未返回（${data.runtime.token_usage_missing_reason||'原因未知'}）`;runtimeBox.textContent=`总耗时 ${data.runtime.total_ms} 毫秒，检索 ${data.runtime.retrieval_rounds} 轮，实际模型 ${data.runtime.final_model||'未使用（本地回答）'}${(data.runtime.attempted_models||[]).length?'，尝试 '+data.runtime.attempted_models.join(' → '):''}，调用 ${data.runtime.external_llm_calls} 次，token ${tokenText}，生成方式 ${displayValue(data.runtime.generation_mode)}${data.runtime.generation_fallback_reason?`，降级原因 ${data.runtime.generation_fallback_reason}`:''}`;}showHits(data.evidence||data.hits);showTrace(data.agent_trace);showGraph(data.knowledge_graph);showRagTrace(data.rag_trace,data.runtime,data.agent_trace);actions.hidden=!data.answer;}catch(e){answer.textContent='错误：'+e.message;}finally{button.disabled=false;}};
async function feedback(helpful){if(!lastResponse)return;const ids=(lastResponse.evidence||[]).map(x=>x.chunk.chunk_id);const body={session_id:sessionId,question:lastRequest.query,answer:lastResponse.answer,helpful,reason:'',selected_tool:lastResponse.selected_tool,source_chunk_ids:ids};const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});actionStatus.textContent=r.ok?'反馈已记录':'反馈保存失败';loadStatus();}
document.querySelector('#helpful').onclick=()=>feedback(true);document.querySelector('#unhelpful').onclick=()=>feedback(false);
document.querySelector('#verify').onclick=async()=>{if(!lastResponse)return;const ids=(lastResponse.evidence||[]).map(x=>x.chunk.chunk_id);const body={model:lastRequest.model,version:lastRequest.version,problem:lastRequest.query,solution:lastResponse.answer,source_chunk_ids:ids,confirmed_by:'web-user'};const r=await fetch('/api/solutions/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();actionStatus.textContent=r.ok?`已保存为验证方案 #${data.solution_id}，后续相似问题会优先复用`:`保存失败：${data.detail}`;loadStatus();};
clearSessionButton.onclick=async()=>{clearSessionButton.disabled=true;try{const r=await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`,{method:'DELETE'});const data=await r.json();if(!r.ok)throw new Error(data.detail||r.statusText);sessionStatus.textContent=`已清空 ${data.removed_turns} 轮记录`;lastRequest=null;lastResponse=null;actions.hidden=true;}catch(e){sessionStatus.textContent='清空失败：'+e.message;}finally{clearSessionButton.disabled=false;}};
loadStatus().catch(e=>statusBox.textContent='状态读取失败：'+e.message);
</script></body></html>
